# macOS 용 앱을 빌드한다. 수동 실행: gh workflow run mac.yml
name: mac
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm install --no-save @tauri-apps/cli
      - run: npx tauri build --target universal-apple-darwin --bundles app
      - name: zip
        run: |
          cd src-tauri/target/universal-apple-darwin/release/bundle/macos
          ls -la
          ditto -c -k --keepParent *.app "$GITHUB_WORKSPACE/sobok-mac.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: sobok-mac
          path: sobok-mac.zip
      # 빌드 서버의 맥에서 실제로 띄워 본다: 눈덩이·눈사람·제설차 자동 장면을 돌리고 화면과 로그를 남긴다
      - name: smoke test
        continue-on-error: true
        run: |
          APP=$(ls -d src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app)
          open -a TextEdit || true
          sleep 3
          SOBOK_STRESS=1 "$APP/Contents/MacOS/sobok" > run.log 2>&1 &
          sleep 12; screencapture -x shot1.png || true
          sleep 5;  screencapture -x shot2.png || true
          sleep 5;  screencapture -x shot3.png || true
          sleep 8;  screencapture -x shot4.png || true
          sleep 30; screencapture -x shot5.png || true
          sleep 5
          pgrep -l sobok || echo "NOT RUNNING"
          echo "--- stdout/stderr"; cat run.log || true
          echo "--- app log"; cat "$HOME/Library/Application Support/com.sobok.widget/sobok.log" || true
          system_profiler SPDisplaysDataType | grep -i -E "resolution|retina" || true
      - uses: actions/upload-artifact@v4
        with:
          name: smoke
          path: |
            shot*.png
            run.log
